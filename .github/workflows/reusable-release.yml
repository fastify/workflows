name: release

on:
  workflow_call:
    inputs:
      semver:
        description: 'Release bump type: patch, minor, major, prepatch, preminor, premajor or prerelease.'
        required: true
        type: string
      preid:
        description: 'The prerelease identifier (e.g. "rc", "beta") used by the pre* bump types. Leave empty for a numeric-only prerelease.'
        required: false
        default: ''
        type: string
      node-version:
        description: 'The Node.js version used to build and publish the package.'
        required: false
        default: 'lts/*'
        type: string
      runs-on:
        description: 'The runner used to publish the package.'
        required: false
        default: 'ubuntu-latest'
        type: string
      environment:
        description: 'The deployment environment that gates the release. Configure it with the required reviewers that are allowed to release.'
        required: false
        default: 'release'
        type: string
      dist-tag:
        description: 'The npm dist-tag to publish under. Use a dedicated tag (e.g. "two") when releasing from a maintenance branch.'
        required: false
        default: 'latest'
        type: string
      make-latest:
        description: 'Whether to mark the GitHub release as the latest one. Set to false when releasing from a maintenance branch.'
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # required for npm provenance via OIDC
      contents: write # required to push the release commit and the tag
    env:
      BUMP_TYPE: ${{ inputs.semver }}
      DIST_TAG: ${{ inputs.dist-tag }}
      PREID: ${{ inputs.preid }}
    steps:
      - name: Validate the inputs
        run: |
          case "$BUMP_TYPE" in
            patch|minor|major) ;;
            prepatch|preminor|premajor|prerelease)
              if [ "$DIST_TAG" = "latest" ]; then
                echo "::error::Refusing to publish a prerelease under the 'latest' dist-tag: set the dist-tag input (e.g. 'next')." && exit 1
              fi
              ;;
            *) echo "::error::Invalid semver input '$BUMP_TYPE': expected patch, minor, major, prepatch, preminor, premajor or prerelease." && exit 1 ;;
          esac
          if [ -n "$PREID" ] && ! printf '%s' "$PREID" | grep -Eq '^[0-9A-Za-z-]+$'; then
            echo "::error::Invalid preid input '$PREID': only alphanumerics and hyphens are allowed." && exit 1
          fi
          # npm rejects empty tags and tags that parse as a semver range (e.g. "2", "v2", "x"),
          # but only at publish time, after the bump commit has been pushed: fail fast instead.
          if ! printf '%s' "$DIST_TAG" | grep -Eq '^[A-Za-z][0-9A-Za-z._-]*$' \
            || printf '%s' "$DIST_TAG" | grep -Eq '^[vV]?(([0-9]+|[xX])(\.([0-9]+|[xX])){0,2}|[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+)$'; then
            echo "::error::Invalid dist-tag input '$DIST_TAG': it must start with a letter, contain only alphanumerics, '.', '_' or '-', and not look like a semver range." && exit 1
          fi

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # explicit: the release commit and tag are pushed below

      - name: Setup Node ${{ inputs.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: true
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - name: Bump package version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(npm version "$(printf '%s' "$BUMP_TYPE")" ${PREID:+--preid "$PREID"} --no-git-tag-version)
          git add -u # stages package.json and the lockfile, whichever the repo tracks
          git commit -m "Bumped v$(printf '%s' "${NEW_VERSION#v}")"
          SAFE_NEW_VERSION=$(printf '%s' "${NEW_VERSION#v}" | tr -d '\r\n')
          printf 'NEW_VERSION=%s\n' "$SAFE_NEW_VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build the release artifacts
        run: npm run --if-present release:build

      - name: Push release commit
        run: git push origin HEAD

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.NEW_VERSION }}
          target_commitish: ${{ github.ref_name }}
          name: v${{ env.NEW_VERSION }}
          generate_release_notes: true # "What's Changed" from merged PRs + contributors + Full Changelog link
          prerelease: ${{ startsWith(inputs.semver, 'pre') }}
          make_latest: ${{ inputs.make-latest && !startsWith(inputs.semver, 'pre') }}
